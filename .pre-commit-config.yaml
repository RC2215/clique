repos:
  - repo: https://github.com/pycqa/isort
    rev: 8.0.1
    hooks:
        - id: isort
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
  - repo: https://github.com/python-poetry/poetry
    rev: 1.8.5
    hooks:
        - id: poetry-check
        - id: poetry-lock
        - id: poetry-install
