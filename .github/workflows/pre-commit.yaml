name: pre-commit

on: [pull_request, push]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
        - name: Check out repository
          uses: actions/checkout@v4
        - name: Set up Python
          uses: actions/setup-python@v5
          id: setup-python
          with:
            python-version-file: pyproject.toml
        - name: Run pre-commit
          uses: pre-commit/action@v3.0.1
